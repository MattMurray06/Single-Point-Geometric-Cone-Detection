geometry_node:
  ros__parameters:
    detection_algorithm: "gaussian propagation" # gaussian propagation; cpd; centreline propagation; voting
    debug: true
    propagation_distance: 1.0
    track_width: 4.4
    sigma_longitudinal: 2.0
    sigma_lateral: 0.2
    max_mahalanobis_distance: 1.0
    score_threshold: 0.6
    max_neighbour_radius: 3.0
    min_neighbour_radius: 0.5
    beam_search_angle_deg: 30.0
    plot_growth: true
