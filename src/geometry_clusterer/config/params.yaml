geometry_node:
  ros__parameters:
    detection_algorithm: "edge propagation" # gaussian propagation; edge propagation; cpd; centreline propagation; voting; edge propagation
    debug: true
    propagation_distance: 1.0
    track_width: 4.4
    sigma_longitudinal: 2.0
    sigma_lateral: 0.2
    max_mahalanobis_distance: 1.0
    score_threshold: 0.6
    max_neighbour_radius: 3.0
    min_neighbour_radius: 0.5
    edge_max_neighbour_radius: 4.5
    edge_min_neighbour_radius: 0.2
    max_angle_change: 30.0
    wall_density_threshold: 1.5
    max_consecutive_angle_change: 25.0
    beam_search_angle_deg: 30.0
    plot_growth: False
